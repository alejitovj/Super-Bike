<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Superbike</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">
    <div class="auth-container">
        <form class="registro-form" method="post" action="{{url_for('registro')}}">

            <h1>Crear Cuenta</h1>
            <p>Únete a la experiencia Superbike</p>
            
            <label>Nombre Completo</label>
            <input type="text" name="Nombre" placeholder="Alejandro Velandia" required>


            <label>Correo Electronico</label>
            <input type="email" name="Correo" placeholder="alejitovj@gmail.com" required>


            <label>Telefono</label>
            <input type="tel" name="Telefono" placeholder="3018154687" required>


            <label>Nombre de usuario</label>
            <input type="text" name="Nombre" placeholder="Juan Montoya" required>

            
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="Crear una contraseña" required>



            <button type="submit">Registrarse</button>

            <span>
                <li><a href="{{ url_for('login') }}">Iniciar sesión</a></li>
            </span>
        </form>
    </div>

    <div id="mensaje-exito" class="toast">
        <div class="toast-icon">✔</div>
        <div class="toast-text">
            <h4>Registro exitoso</h4>
            <p>Bienvenido a Superbike 🚲</p>
        </div>
        <div class="toast-bar"></div>
    </div>

    <script>
        const formulario = document.getElementById("registroForm");
        formulario.addEventListener("submit", function(e) {
            e.preventDefault();
            const datos = new FormData(this);
            fetch("/registro/", {
                method: "POST",
                body: datos
            })
            .then(res => res.text())
            .then(respuesta => {
                if (respuesta.trim() == "ok") {
                    const toast = document.getElementById("mensaje-exito");
                    toast.style.display = "flex";
                    const barra = toast.querySelector(".toast-bar");
                    barra.style.animation = "none";
                    barra.offsetHeight;
                    barra.style.animation = "barra 2.5s linear forwards";
                    formulario.reset();
                    setTimeout(() => {
                        toast.style.display = "none";
                    }, 2500);
                } else {
                    alert(respuesta);
                }
            });
        });
    </script>

</body>
</html>
